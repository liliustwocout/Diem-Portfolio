<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#FFF5E4" />
      <stop offset="100%" stop-color="#FFECCB" />
    </linearGradient>
    <radialGradient id="glow-04" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFA502" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FF4757" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFDF9" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Soft Warm Cream Background -->
  <rect width="1600" height="1000" fill="url(#bg-04)" />
  <circle cx="1200" cy="380" r="520" fill="url(#glow-04)" />

  <!-- Soft Rounded Decorative Border Frame -->
  <rect x="70" y="70" width="1460" height="860" rx="36" fill="none" stroke="#E5A93C" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 8" />
  <rect x="90" y="90" width="1420" height="820" rx="28" fill="none" stroke="#E63946" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Cute Header Stamp -->
  <text x="140" y="150" font-family="'Quicksand', sans-serif" font-size="16" fill="#E63946" font-weight="bold" letter-spacing="2">✿ TRẦN PHƯƠNG DIỄM // ĐỒ ÁN SỐ 04</text>
  <text x="1460" y="150" font-family="'Quicksand', sans-serif" font-size="16" fill="#D48B16" text-anchor="end" font-weight="bold">ĐẠI HỌC KIẾN TRÚC HÀ NỘI ✧</text>

  <!-- Title & Category in Soft Curvy Style -->
  <text x="140" y="270" font-family="'Quicksand', sans-serif" font-weight="700" font-size="22" fill="#E63946" letter-spacing="4">✿ TYPOGRAPHY POSTER</text>
  <text x="140" y="390" font-family="'Playfair Display', serif" font-style="italic" font-weight="700" font-size="80" fill="#2C2623" letter-spacing="-1">CHỮ ĐỘNG ĐÔNG DƯƠNG</text>
  

  <!-- Description -->
  <text x="140" y="475" font-family="'Quicksand', sans-serif" font-weight="600" font-size="26" fill="#4A413B">
    Chuỗi poster thể nghiệm nghệ thuật chữ uốn lượn phong vị xưa
  </text>
  <text x="140" y="520" font-family="'Dancing Script', cursive" font-size="32" fill="#E63946">
    Thiết kế bởi Phương Diễm ✿ Khoa Thiết kế Đồ họa HAU
  </text>

  <!-- Cute Flower & Circular Graphic Ornament on the Right -->
  <g transform="translate(1220, 520)">
    <!-- Soft flower petals -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#E5A93C" stroke-opacity="0.3" stroke-width="2" />
    <circle cx="0" cy="0" r="170" fill="#FFF9EC" stroke="#E63946" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 6" />
    
    <!-- Rotating decorative petals -->
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="#FF4757" fill-opacity="0.08" stroke="#E63946" stroke-width="1.8" transform="rotate(0)" />
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="#FF4757" fill-opacity="0.08" stroke="#E63946" stroke-width="1.8" transform="rotate(45)" />
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="#FF4757" fill-opacity="0.08" stroke="#E63946" stroke-width="1.8" transform="rotate(90)" />
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="#FF4757" fill-opacity="0.08" stroke="#E63946" stroke-width="1.8" transform="rotate(135)" />
    
    <!-- Center flower core -->
    <circle cx="0" cy="0" r="28" fill="#E5A93C" />
    <circle cx="0" cy="0" r="14" fill="#E63946" />
    <text x="0" y="210" font-family="'Dancing Script', cursive" font-size="28" fill="#E63946" text-anchor="middle" font-weight="bold">Made with love ✿</text>
  </g>

  <!-- Cute Pill Badges -->
  <rect x="140" y="810" width="190" height="48" rx="24" fill="#E63946" />
  <text x="235" y="841" font-family="'Quicksand', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ĐỒ ÁN 04 ✿</text>

  <rect x="350" y="810" width="280" height="48" rx="24" fill="#FFF3D4" stroke="#E5A93C" stroke-width="1.8" />
  <text x="490" y="841" font-family="'Quicksand', sans-serif" font-size="15" fill="#B87E1B" text-anchor="middle" font-weight="bold">✿ CHỮ UỐN LƯỢN</text>

  <text x="1460" y="842" font-family="'Dancing Script', cursive" font-size="28" fill="#E63946" text-anchor="end" font-weight="bold">Bấm để xem chi tiết nhé ✿ →</text>
</svg>